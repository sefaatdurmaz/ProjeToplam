<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barış Tayyar Proje - DWG Portalı</title>
    <script>
      var sifre = prompt("Lütfen projeyi görüntülemek için şifreyi giriniz:");
      if (sifre !== "300799") { // Şifreniz
        alert("Hatalı şifre!");
        document.write("<h1 style='color:white; text-align:center; margin-top:20%; font-family:sans-serif;'>Erişim engellendi.</h1>");
        window.stop();
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #121212;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .container {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 16px;
        padding: 40px 30px;
        max-width: 500px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      }
      .badge {
        display: inline-block;
        background: rgba(6, 150, 215, 0.15);
        color: #0696d7;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 20px;
      }
      h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; color: #f5f5f5; }
      p { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 30px; }
      .btn {
        display: block;
        width: 100%;
        padding: 16px;
        background-color: #0696d7;
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(6, 150, 215, 0.3);
        margin-bottom: 14px;
      }
      .btn:hover {
        background-color: #0077b5;
        transform: translateY(-2px);
      }
    </style>
</head>
<body>

<div class="container">
    <span class="badge">DWG Proje Portalı</span>
    <h1>Barış Tayyar Proje</h1>
    <p>Lütfen incelemek istediğiniz markayı veya binayı seçiniz:</p>

    <!-- Marka Yönlendirme Butonları -->

    <a href="Porsche/index.html" class="btn">Porsche Projeleri ↗</a>
    <a href="VW/index.html" class="btn">Volkswagen Projeleri ↗</a>
    <a href="Servis/index.html" class="btn">Servis Projeleri ↗</a>
</div>

</html>
